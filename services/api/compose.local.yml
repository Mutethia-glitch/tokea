# Developer-only PostgreSQL container. No cloud hosting or external services.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tokea_dev
      POSTGRES_PASSWORD: tokea_dev_only
      POSTGRES_DB: tokea_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tokea_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokea_dev -d tokea_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tokea_postgres_local:
