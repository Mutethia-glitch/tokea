name: Tokea prototype checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Run tests
        run: bun run test
      - name: Install browser testing runtime
        run: |
          bun add --no-save playwright@1.58.2
          bunx playwright@1.58.2 install chromium
      - name: Browser smoke test
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/tokea-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -60 /tmp/tokea-preview.log' EXIT
          bun scripts/browser-smoke.mjs
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokea-mobile-smoke
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
