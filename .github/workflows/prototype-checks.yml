name: Tokea prototype checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Run tests
        run: bun run test
      - name: Install browser testing runtime
        run: |
          bun add --no-save playwright@1.58.2
          bunx playwright@1.58.2 install chromium
      - name: Browser smoke test
        run: |
          bunx vite dev --host 127.0.0.1 --port 4173 > /tmp/tokea-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -60 /tmp/tokea-preview.log' EXIT
          bun scripts/browser-smoke.mjs
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokea-mobile-smoke
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  api-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tokea_ci
          POSTGRES_PASSWORD: tokea_ci
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tokea_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:tokea_ci@127.0.0.1:5432/tokea_ci
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install API packages
        run: bun install --no-save
      - name: Typecheck API
        run: bun run typecheck
      - name: Compile API
        run: bun run build
      - name: Migrate isolated test PostgreSQL
        run: bun scripts/migrate.mjs
      - name: Test API decisions, DB transactions and notification inbox
        run: bun run test

  native-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install Expo packages
        run: bun install
      - name: Typecheck native app
        run: bun run typecheck
      - name: Validate Kenyan mobile-number formats
        run: bun run test:phone
      - name: Validate Expo Android JS bundle
        run: bunx expo export --platform android --output-dir .expo-dist
